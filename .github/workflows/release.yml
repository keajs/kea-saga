name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (blank for the prepared release or next minor)
        required: false
        type: string
permissions:
  contents: read
jobs:
  release:
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: keajs/kea-typegen/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
